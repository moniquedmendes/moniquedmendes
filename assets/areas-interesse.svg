<svg width="860" height="220" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap');
      .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #e6e6e6; }
      .card-sub   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #8b8fa8; }
      .icon       { font-size: 22px; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="220" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#e6e6e6">🧠 Áreas de interesse</text>
  <line x1="28" y1="56" x2="832" y2="56" stroke="#21262d" stroke-width="1"/>

  <!-- Card 1: Machine Learning -->
  <rect x="20" y="68" width="192" height="136" rx="10" fill="#161b22" stroke="#7F77DD" stroke-width="1.5"/>
  <rect x="20" y="68" width="192" height="5" rx="10" fill="#7F77DD"/>
  <text x="36" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e6e6e6">🤖</text>
  <text x="64" y="104" class="card-title" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#e6e6e6">Machine Learning</text>
  <text x="36" y="128" class="card-sub" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8b8fa8">sklearn · numpy · pandas</text>
  <text x="36" y="145" class="card-sub" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8b8fa8">redes neurais · TensorFlow</text>

  <!-- Card 2: Redes -->
  <rect x="228" y="68" width="192" height="136" rx="10" fill="#161b22" stroke="#1D9E75" stroke-width="1.5"/>
  <rect x="228" y="68" width="192" height="5" rx="10" fill="#1D9E75"/>
  <text x="244" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e6e6e6">🌐</text>
  <text x="272" y="104" class="card-title" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#e6e6e6">Redes</text>
  <text x="244" y="128" class="card-sub" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8b8fa8">TCP/IP · protocolos</text>
  <text x="244" y="145" class="card-sub" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8b8fa8">infra · roteamento</text>

  <!-- Card 3: Cyber Segurança -->
  <rect x="436" y="68" width="192" height="136" rx="10" fill="#161b22" stroke="#D85A30" stroke-width="1.5"/>
  <rect x="436" y="68" width="192" height="5" rx="10" fill="#D85A30"/>
  <text x="452" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e6e6e6">🔐</text>
  <text x="480" y="104" class="card-title" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#e6e6e6">Cyber Segurança</text>
  <text x="452" y="128" class="card-sub" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8b8fa8">pentest · criptografia</text>
  <text x="452" y="145" class="card-sub" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8b8fa8">análise de vulnerabilidades</text>

  <!-- Card 4: Hardware -->
  <rect x="644" y="68" width="196" height="136" rx="10" fill="#161b22" stroke="#BA7517" stroke-width="1.5"/>
  <rect x="644" y="68" width="196" height="5" rx="10" fill="#BA7517"/>
  <text x="660" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#e6e6e6">🔧</text>
  <text x="688" y="104" class="card-title" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#e6e6e6">Hardware</text>
  <text x="660" y="128" class="card-sub" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8b8fa8">embarcados · Arduino</text>
  <text x="660" y="145" class="card-sub" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8b8fa8">eletrônica · IoT</text>
</svg>
